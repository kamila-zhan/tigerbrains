# Configurations
title:            Tiger Brains
longtitle:        Brain & Psychology
author:           Kamila Zhanuzak
email:            kzhanuzak8@gmail.com
description: >
  Collection of notes about brain and psychology

version:          1.0
gitbook_version:  3.2.3

url:              'https://kamila-zhan.github.io'
baseurl:          '/tigerbrains'
rss:              RSS

# bootstrap: use the remote theme for the site itself
remote_theme: sighingnow/jekyll-gitbook

toc:
  enabled: true
  h_min:   1
  h_max:   3

# customize the link favicon in header, will be {{site.baseurl}}/{{site.favicon_path}}
favicon_path:     /assets/TigerBrains.ico

# markdown render engine.
markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: colorful

markdown_ext:             markdown,mkdown,mkdn,mkd,md

# Permalinks
permalink:                /:title

exclude:
  - _drafts

collections:
  cbt:
    output: true
    permalink: /:collection/:path/
  others:
    output: false
    permalink: /:collection/:path/

ordered_collections:
  - posts
  - cbt
  - others

page_width: 800px

destination:      ./_site
incremental:      false
regenerate:       true

plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jemoji
